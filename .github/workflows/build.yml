# Build the OS image and push it to GHCR (ghcr.io/<owner>/fedora-bootc).
#
# A build publishes exactly two tags and overwrites nothing:
#
#   build-<sha>        unsealed: an ordinary bootc image
#   build-<sha>-uki    the same thing sealed into a signed UKI
#
# The tags machines follow (latest, latest-uki) are never written here:
# release.yml promotes a build to them once its ISO is built and the release
# is published, by pointing those tags at a digest that already exists.
# Promotion keeps the digest, so the cosign signature made here still covers
# it.
#
# Every build is therefore installable and none of them displaces another. Old
# ones are collected at the end of this file.
#
# Runs on pushes to main (changes that cannot touch the image excluded, ci.yml
# covers those), on demand, and as the first job of a release. It has
# no schedule of its own: the weekly release rebuilds on the floating Fedora
# base, and Renovate's merges (actions, chunkah, noctalia-greeter) trigger a
# build.
# Pull requests reach it through ci.yml, the PR gate, and only build and scan.
# Every pushed image is signed with cosign, in the `sign` job once every push
# is done (.github/actions/sign); unsigned images are unusable.
#
# The private keys, the Secure Boot ones (SECUREBOOT_PRIVATE_KEY, the db key,
# which the image job's build uses, and SECUREBOOT_PK_PRIVATE_KEY and
# SECUREBOOT_KEK_PRIVATE_KEY, which only the enroll job uses, to sign the
# enrollment sets) and SIGNING_SECRET (cosign), are referenced only by the
# jobs that declare the `release` environment, and
# what runs on the runner in those jobs is kept to the build (inside
# podman), cosign and GitHub's and Docker's own pinned actions: trivy runs
# in containers without secrets or network (.github/actions/scan-image),
# `just` comes from its checked release (.github/actions/install-tools),
# and the cosign key is used in a job that does nothing else. A third-party
# binary on the runner could read every secret of its job out of the
# runner's memory. Kept as secrets of that environment, restricted to main
# (docs/fork.md), they reach those jobs alone and no workflow on another
# branch; as repository secrets (which work too) any job that names them
# can read them.
#
# Runs on GitHub-hosted ubuntu-26.04 runners (rootless podman 5.x). Each job is
# a fresh VM with no layer cache, so every job builds what it needs from
# scratch; .github/actions/prepare-runner gets the VM ready for that. The
# jobs run the Justfile's recipes (enroll, build), so a build here is the
# same as one on a local machine.
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      # host helpers (ci.yml lints them)
      - "scripts/**"
      # the pins of the tools CI runs (just, gh, trivy), not part of the
      # image: ci.yml lints with them, scans the live image with them and
      # checks the pins
      - ".github/actions/install-tools/tools.txt"
      - ".github/actions/install-tools/install.sh"
      - ".github/actions/install-tools/verify-pins.sh"
      # the live ISO's system, not the image: release.yml builds it (ci.yml
      # on pull requests)
      - "installer/**"
      # CI plumbing that builds nothing itself; ci.yml lints it on push
      - "renovate.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/notify.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/security.yml"
      - ".github/workflows/alerts.yml"
      - ".github/actions/scan-image/assign-alerts.sh"
      - ".github/actions/scan-image/watch.sh"
      - ".github/actions/scan-image/security-issue.sh"
      - ".github/rulesets/**"
      - ".github/actionlint.yaml"
      - ".github/zizmor.yml"
  workflow_dispatch:
  # Called by release.yml and by ci.yml (pull requests).
  workflow_call:
    inputs:
      # From release.yml, when security.yml started the release: the
      # Fedora security updates the image must contain
      # (.github/actions/scan-image).
      security:
        description: "Fedora security updates the image must contain (ADVISORY SEVERITY PACKAGES; ...)"
        required: false
        type: string
        default: ""
    # The keys, passed by name from release.yml (an environment secret
    # resolves in the job that declares the environment, here). ci.yml
    # passes none: a pull request pushes and signs nothing.
    secrets:
      SECUREBOOT_PRIVATE_KEY:
        description: the Secure Boot db key (keys/README.md); a push build without it fails
        required: false
      SECUREBOOT_PK_PRIVATE_KEY:
        description: the Secure Boot PK key, which signs the enrollment sets' PK.auth and KEK.auth (keys/README.md); a push build without it fails
        required: false
      SECUREBOOT_KEK_PRIVATE_KEY:
        description: the Secure Boot KEK key, which signs the enrollment sets' db.auth (keys/README.md); a push build without it fails
        required: false
      SIGNING_SECRET:
        description: the cosign private key; a push build without it fails at `sign`
        required: false

# The group is prefixed rather than just ${{ github.workflow }}, because in a
# called workflow that variable holds the CALLER's name: without the prefix a
# release run's build job and the release workflow itself would share a group.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Only push/PR builds supersede each other. A release must not be cancelled
  # halfway by an unrelated push to main.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

# bash with -o pipefail on every step (the implicit default shell has no
# pipefail), so a failing command on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  IMAGE_NAME: fedora-bootc

jobs:
  # The Secure Boot enrollment sets (`just enroll`), signed here and handed to
  # the image job as an artifact: the one job with the PK and KEK keys, which
  # reach the one step that signs, with no network. The tools that step uses
  # are built before the keys are written, so nothing downloads while they
  # are on the runner.
  #
  # Not on pull requests: the image job there signs a throwaway tree's sets
  # itself (`just build`).
  enroll:
    name: enroll
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release   # the PK and KEK keys (the Sign step)
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the runner
        uses: ./.github/actions/prepare-runner
        with:
          need: "10"
          pull-from: image/enroll.Containerfile

      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tools: just

      - name: Build the signing tools
        run: podman build --pull=missing --target tools -f image/enroll.Containerfile .

      # `just enroll`, as on a local machine. The keys are files outside the
      # checkout, gone when the step ends (also on failure); the build mounts
      # them as podman secrets into the signing step alone (the Justfile has
      # the why).
      - name: Sign
        env:
          SECUREBOOT_PK_PRIVATE_KEY: ${{ secrets.SECUREBOOT_PK_PRIVATE_KEY }}
          SECUREBOOT_KEK_PRIVATE_KEY: ${{ secrets.SECUREBOOT_KEK_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for secret in SECUREBOOT_PK_PRIVATE_KEY SECUREBOOT_KEK_PRIVATE_KEY; do
            test -n "${!secret}" || { echo "$secret secret is not set; see keys/README.md"; exit 1; }
          done
          for cert in keys/db/db.pem keys/PK/PK.pem keys/KEK/KEK.pem keys/GUID; do
            test -f "$cert" || { echo "$cert is missing (run: just keygen, commit the public halves)"; exit 1; }
          done
          sb=$(mktemp -d -p "$RUNNER_TEMP")
          trap 'rm -rf "$sb"' EXIT
          (
            umask 077
            printf '%s\n' "$SECUREBOOT_PK_PRIVATE_KEY" > "$sb/PK.key"
            printf '%s\n' "$SECUREBOOT_KEK_PRIVATE_KEY" > "$sb/KEK.key"
          )
          SECUREBOOT_PK_KEY="$sb/PK.key" SECUREBOOT_KEK_KEY="$sb/KEK.key" \
            just enroll "$RUNNER_TEMP/sets"
          find "$RUNNER_TEMP/sets" -type f | sort

      - name: Hand the sets to the image job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enrollment-sets
          path: ${{ runner.temp }}/sets
          # Public files (signed lists of public certificates), kept as long
          # as a failed image job may still be re-run on its own.
          retention-days: 7
          if-no-files-found: error
          # A re-run of the whole workflow signs them again under the same
          # name while the first attempt's are still there, as in
          # .github/actions/publish.
          overwrite: true

  # The image with every feature, then its seal.
  image:
    name: image
    needs: enroll
    # Runs after a successful enroll, or without one on a pull request (enroll
    # is skipped there, see above); never after a failure or a cancel.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    # The Secure Boot db key (the Build step), except on pull requests, which
    # sign with a throwaway one and need no secret: no environment there (an
    # empty name is none, and creates no deployment), so that an environment
    # restricted to main does not turn them away.
    environment:
      name: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    permissions:
      contents: read
      packages: write
      security-events: write   # scan results to code scanning (scan-image)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build needs real room: during a sealed build the image exists
      # several times at once (the image, the split image, chunkah's OCI
      # directory under /var/tmp, its import), about 35 GB. A public-repo
      # runner has ~90 GB free on its root disk, where
      # /var/tmp and rootless podman's storage live; the action frees more if
      # a runner comes with less, and fails right here if 50 GB are not there.
      # It pre-pulls what the files this job builds start from.
      - name: Prepare the runner
        uses: ./.github/actions/prepare-runner
        with:
          pull-from: image/*.Containerfile

      # The sets the enroll job signed. A pull request's build signs a
      # throwaway tree's itself (the Build step).
      - name: The enrollment sets
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: enrollment-sets
          path: ${{ runner.temp }}/sets

      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tools: just

      # For the chunkah check below only; the signing key is not in this job.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"

      # chunkah writes the layers that get sealed and signed. Its pin
      # (image/seal.Containerfile) is checked against the keyless signature
      # its release workflow made before the build runs it; the Justfile
      # recipe has the identity.
      - name: Verify chunkah
        run: just verify-chunkah

      # The same `just build` as on a local machine: the unsealed image
      # (published in its own right below), then its seal, :latest-uki.
      #
      # The db key signs systemd-boot, the sealed UKI and the NVIDIA kernel
      # modules. A machine that enrolled the key can only
      # Secure-Boot images signed with it, so pushed builds REQUIRE the
      # secret. Pull requests never get it, not even Renovate's from this
      # repository (ci.yml passes no secrets): they push nothing, so a
      # throwaway key exercises the build end to end just as well, and code
      # nobody has reviewed yet never runs next to the real one. A pull
      # request has no enroll job, so it makes a whole throwaway tree: its PK
      # and KEK sign its enrollment sets here. A push takes the sets the
      # enroll job signed (ENROLL_DIR) and needs the db key alone.
      #
      # The key is a file outside the checkout, gone when the step ends (also
      # on failure); the builds mount it as a podman secret into the steps
      # that sign, nothing else sees it (the Justfile has the why).
      - name: Build
        env:
          SECUREBOOT_PRIVATE_KEY: ${{ secrets.SECUREBOOT_PRIVATE_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sb=$(mktemp -d -p "$RUNNER_TEMP")
          trap 'rm -rf "$sb"' EXIT
          if [ "$EVENT" = "pull_request" ]; then
            for k in PK KEK db; do
              openssl req -x509 -new -nodes -newkey rsa:4096 -sha256 -days 1 -batch \
                -subj "/CN=throwaway PR build $k/" \
                -keyout "$sb/$k.key" -out "$sb/$k.pem"
            done
            export SECUREBOOT_CERT="$sb/db.pem" \
              SECUREBOOT_PK_KEY="$sb/PK.key" SECUREBOOT_PK_CERT="$sb/PK.pem" \
              SECUREBOOT_KEK_KEY="$sb/KEK.key" SECUREBOOT_KEK_CERT="$sb/KEK.pem"
          elif [ -n "$SECUREBOOT_PRIVATE_KEY" ]; then
            test -f keys/db/db.pem || { echo "keys/db/db.pem is missing (run: just keygen, commit the public halves)"; exit 1; }
            (umask 077; printf '%s\n' "$SECUREBOOT_PRIVATE_KEY" > "$sb/db.key")
            export ENROLL_DIR="$RUNNER_TEMP/sets"
          else
            echo "SECUREBOOT_PRIVATE_KEY secret is not set; pushed images must be signed with the enrolled db key (keys/README.md)"
            exit 1
          fi
          export SECUREBOOT_KEY="$sb/db.key"
          just build
          df -h /

      # Both scans before anything is pushed and before the login: no
      # registry credential is on the runner while they run. Pull requests
      # too: they push nothing, but what would stop the push fails the PR,
      # except a pending Fedora update, which only warns there
      # (.github/actions/scan-image).
      - name: Scan the unsealed image
        uses: ./.github/actions/scan-image
        with:
          image: localhost/${{ env.IMAGE_NAME }}:latest
          name: latest
          require: ${{ inputs.security }}

      - name: Scan the sealed image
        uses: ./.github/actions/scan-image
        with:
          image: localhost/${{ env.IMAGE_NAME }}:latest-uki
          name: latest-uki
          require: ${{ inputs.security }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-<sha>, signed by `sign` below like everything here: the image's
      # own policy refuses an unsigned pull from this repo, and the unsealed
      # image is meant to be installable too.
      - name: Publish the unsealed image
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/publish
        with:
          image: localhost/${{ env.IMAGE_NAME }}:latest
          suffix: ""
          repository: ${{ env.IMAGE_NAME }}

      - name: Publish the sealed image
        if: github.event_name != 'pull_request'
        id: publish
        uses: ./.github/actions/publish
        with:
          image: localhost/${{ env.IMAGE_NAME }}:latest-uki
          suffix: -uki
          repository: ${{ env.IMAGE_NAME }}

      # Which disk filled, and what was on it. The build is the only thing here
      # big enough to run out of space, and this is the only record of it.
      - name: Disk usage on failure
        if: failure()
        run: |
          df -h / || true
          du -sh "$(podman info --format '{{.Store.GraphRoot}}')" 2>/dev/null || true
          podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}' || true

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ steps.publish.outputs.ref }}
        run: |
          tag="${REF%@*}:build-${GITHUB_SHA:0:7}-uki"
          {
            echo "### Sealed image"
            echo '```'
            echo "${tag}"
            echo "${REF}"
            echo '```'
            echo "Install this build:"
            echo '```'
            echo "sudo bootc switch ${tag}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Signs everything the jobs above pushed, with the cosign key: the one
  # job that holds it, and it runs nothing but checkout, the artifact
  # download and cosign (.github/actions/sign has the why). The digests come
  # from the publish steps as artifacts, so exactly this run's images are
  # signed. Once the image job is done, whatever it pushed: a failed one
  # pushed at most the unsealed image, which is signed all the same, and
  # fails the run.
  sign:
    name: sign
    needs: [enroll, image]
    if: ${{ !cancelled() && needs.enroll.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release   # the cosign key
    permissions:
      contents: read    # keys/cosign.pub
      packages: write   # the signatures
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pushed digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pushed*
          merge-multiple: true
          path: ${{ runner.temp }}/pushed

      - name: Sign and verify
        uses: ./.github/actions/sign
        with:
          refs-dir: ${{ runner.temp }}/pushed
          cosign-key: ${{ secrets.SIGNING_SECRET }}
          registry-token: ${{ github.token }}

  # Once the image was pushed and signed. It keeps the newest 6 build
  # images, about two builds' worth: the unsealed and the sealed image of
  # each, and a release's live image.
  #
  # A version is only ever considered when it HAS tags and EVERY one of
  # them starts with build-, which makes it impossible to delete something
  # a machine follows even if a promoted digest also carries its build tag.
  #
  # Only after a run that published the image, and best effort on purpose:
  # deleting package versions needs the package to grant this repository
  # the Admin role (package settings, Manage Actions access), and tidying up
  # must never fail a build that otherwise succeeded.
  collect:
    name: collect
    needs: [image, sign]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      packages: write   # deleting old package versions
    steps:
      - name: Collect old builds
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "6"
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          api="/users/${owner}/packages/container/${IMAGE_NAME}/versions"
          gh api --paginate "$api" > "${RUNNER_TEMP}/versions.json"
          jq -r --argjson keep "$KEEP" '
            map(select((.metadata.container.tags | length) > 0
                        and (.metadata.container.tags | all(startswith("build-")))))
            | sort_by(.created_at) | reverse | .[$keep:][]
            | "\(.id) \(.metadata.container.tags | join(","))"
          ' "${RUNNER_TEMP}/versions.json" > "${RUNNER_TEMP}/collect.txt"
          echo "collectable: $(wc -l < "${RUNNER_TEMP}/collect.txt") (keeping the newest ${KEEP})"
          while read -r id tags; do
            [ -n "${id:-}" ] || continue
            echo "deleting ${tags} (${id})"
            gh api -X DELETE "${api}/${id}" >/dev/null || echo "  could not delete ${id}"
          done < "${RUNNER_TEMP}/collect.txt"
