# The pull request gate. Every PR runs this one workflow, and its last job,
# `ci-ok`, is the one status check that matters: the main branch ruleset
# requires it, so nothing merges (Renovate's automerge included) until it is
# green.
#
# Why one gate instead of a pull_request trigger on each workflow:
#
# - The image build is a chain (plan and base, then one job per image) whose
#   later jobs only exist once the earlier ones finished. "Every check so
#   far is green" can be true in the gap between two links, and an automerge
#   that looks at that merges a PR whose build has not even started.
# - The image build and the ISO only matter for some paths. A required
#   check from a path-filtered workflow never reports on the PRs it skips,
#   and blocks them forever.
#
# `ci-ok` exists on every PR and reports only after everything it depends on
# has finished: skipped (not affected by this PR) counts as passed, failed or
# cancelled does not. The ruleset does not require PRs to be up to date with
# main (every direct push would restart hours of build on the open Renovate
# PR); what lands is built again by build.yml on the push, and notify.yml
# reports it if that fails.
#
# What a PR gets: lint always; the image build (every image, sealed) when
# the PR can affect it; a rehearsal of the publishing steps (push, sign,
# verify, promote) always; the live ISO when something it is made of
# changes; and the pins of the tools CI runs (just, gh, trivy) against
# upstream's signatures when one changes. Together that runs every tool the
# merge will later publish with, so an automerged update of one is tested
# before it lands.
#
# On a push to main only the lint job and the signing rehearsal run, and only
# when CI plumbing, scripts/ or installer/ changed (build.yml runs itself on
# push): those files are in build.yml's paths-ignore, and without this a push
# touching only them would run no CI at all. The ISO itself is built by
# release.yml.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "renovate.json"
      - "scripts/**"
      - "installer/**"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Which of the expensive workflows this PR can affect. The image rule is
  # build.yml's `paths-ignore` turned around: anything not listed there can
  # change the image. The publishing actions (publish, sign) are the one
  # exception: build.yml runs them on push only, so a pull request's image
  # build would not exercise them (lint checks them, `signing` rehearses
  # their commands). This workflow itself counts as everything, so a change to
  # the wiring runs all of it, and so does the shared prepare-runner action.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      image: ${{ steps.classify.outputs.image }}
      renovate: ${{ steps.classify.outputs.renovate }}
      iso: ${{ steps.classify.outputs.iso }}
      pins: ${{ steps.classify.outputs.pins }}
    steps:
      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            # The other workflows run on push by themselves; here only lint.
            printf '%s\n' image=false renovate=true iso=false pins=false | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both names of a rename: moving a file out of the image's paths
          # changes the image too.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > files.txt
          echo "changed files:"; sed 's/^/  /' files.txt

          image=false renovate=false iso=false pins=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/ci.yml)
                image=true; renovate=true; iso=true; pins=true ;;
              # used by every job that runs podman
              .github/actions/prepare-runner/*)
                image=true; iso=true ;;
              # what security.yml, alerts.yml and the security jobs run:
              # they scan nothing before a push
              .github/actions/scan-image/assign-alerts.sh|.github/actions/scan-image/watch.sh|\
              .github/actions/scan-image/security-issue.sh) ;;
              # scans every image before it is pushed
              .github/actions/scan-image/*)
                image=true; iso=true ;;
              # the pins of just, gh and trivy and their installer. The OS
              # images are not rebuilt for a bump of those: the live image
              # runs the same scan, and lint runs just.
              .github/actions/install-tools/tools.txt|.github/actions/install-tools/install.sh)
                iso=true ;;
              .github/actions/install-tools/verify-pins.sh) ;;
              # installs just for every job that runs recipes (lint always)
              .github/actions/install-tools/*)
                image=true; iso=true ;;
            esac
            case "$f" in
              *.md|docs/*|scripts/*|installer/*|renovate.json|\
              .github/workflows/ci.yml|.github/workflows/notify.yml|\
              .github/workflows/release.yml|.github/workflows/security.yml|.github/workflows/alerts.yml|\
              .github/rulesets/*|.github/actionlint.yaml|.github/zizmor.yml|\
              .github/actions/publish/*|.github/actions/sign/*|\
              .github/actions/install-tools/tools.txt|.github/actions/install-tools/install.sh|\
              .github/actions/install-tools/verify-pins.sh|\
              .github/actions/scan-image/assign-alerts.sh|.github/actions/scan-image/watch.sh|\
              .github/actions/scan-image/security-issue.sh) ;;
              *) image=true ;;
            esac
            case "$f" in
              renovate.json) renovate=true ;;
            esac
            # The pins, and how they are checked against upstream.
            case "$f" in
              .github/actions/install-tools/tools.txt|.github/actions/install-tools/verify-pins.sh) pins=true ;;
            esac
            # What the live ISO is made of (installer/live.Containerfile and
            # the rest of installer/, the signature policy and key, the build
            # context) and how release.yml and the Justfile assemble it.
            case "$f" in
              .containerignore|Justfile|installer/*|features/updates/overlay/etc/containers/*|keys/cosign.pub|\
              .github/workflows/release.yml) iso=true ;;
            esac
          done < files.txt
          # The files API stops at 3000 files. Anything that big runs
          # everything rather than trusting a truncated list.
          if [ "${CHANGED:-0}" -ge 3000 ]; then
            echo "::notice::${CHANGED} changed files, more than the API lists: running everything"
            image=true renovate=true iso=true pins=true
          fi
          {
            echo "image=$image"
            echo "renovate=$renovate"
            echo "iso=$iso"
            echo "pins=$pins"
          } | tee -a "$GITHUB_OUTPUT"

  # Cheap, and on every PR: the workflow files themselves (actionlint runs
  # shellcheck on every `run:` block, zizmor audits them for supply-chain
  # and permission mistakes), the shell syntax of every script and the
  # features (`just check`), and the Renovate config when it changed.
  lint:
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # renovate: datasource=docker depName=docker.io/rhysd/actionlint
      ACTIONLINT_VERSION: "1.7.12"
      # renovate: datasource=github-releases depName=zizmorcore/zizmor
      ZIZMOR_VERSION: "v1.31.1"
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: "44.176.4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          docker run --rm -v "$PWD":/repo:ro --workdir /repo \
            "docker.io/rhysd/actionlint:${ACTIONLINT_VERSION}" -color

      - name: Install just and gh
        uses: ./.github/actions/install-tools
        with:
          tools: just gh

      # The release binary, run only once GitHub's build provenance shows it
      # came from zizmor's release workflow at that tag. With the job's
      # token (read-only) it also runs its online audits, such as an action
      # pinned to a commit that is not in the action's repository, or a
      # known-vulnerable action. The findings that are by design are in
      # .github/zizmor.yml and inline.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/zizmor"
          tarball="${dir}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 5 --retry-all-errors -o "$tarball" \
            "https://github.com/zizmorcore/zizmor/releases/download/${ZIZMOR_VERSION}/${tarball##*/}"
          # GitHub's attestation API fails with a 503 at times.
          for attempt in 1 2 3; do
            gh attestation verify "$tarball" --repo zizmorcore/zizmor \
              --signer-workflow zizmorcore/zizmor/.github/workflows/release-binaries.yml \
              --source-ref "refs/tags/${ZIZMOR_VERSION}" --deny-self-hosted-runners && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          tar -xzf "$tarball" -C "$dir"
          "${dir}/zizmor" --no-progress --format=github .github/

      # Every script's syntax and how the features fit together (no file
      # shipped twice, hooks that can run, the extras' names, the Secure Boot
      # key in its three steps only; the image build checks the features
      # too).
      - name: Syntax and features
        run: just check

      # Renovate needs a current Node (44.x: 24 or newer).
      - name: Node for Renovate
        if: needs.changes.outputs.renovate == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Renovate config
        if: needs.changes.outputs.renovate == 'true'
        # No file argument: with one, the validator treats it as a GLOBAL
        # (self-hosted) config. Without, it finds renovate.json and checks it
        # as the repository config it is.
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  # The pins of the tools CI runs (.github/actions/install-tools/tools.txt)
  # against what upstream signs or attests at that version, beyond the sha256
  # install.sh checks (verify-pins.sh next to it has what and why). Their
  # checks need gh and cosign only. No secrets: the token only reads public
  # releases and attestations.
  pins:
    name: pins
    needs: changes
    if: needs.changes.outputs.pins == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The verifiers come pinned and checked as well. gh is the base
      # branch's pin (install.sh, sha256), which this job checked when it was
      # merged: a pull request that bumps gh is checked with the one it
      # replaces, not by itself.
      - name: Checkout the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # cosign-installer checks the release it installs.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"

      - name: Install gh
        run: base/.github/actions/install-tools/install.sh "${RUNNER_TEMP}/verifiers" gh

      - name: Check the pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PATH="${RUNNER_TEMP}/verifiers/bin:${PATH}" \
            .github/actions/install-tools/verify-pins.sh .github/actions/install-tools/tools.txt

  # No secrets on purpose, not even for Renovate's same-repository PRs: a PR
  # build pushes and signs nothing, so it uses a throwaway Secure Boot key,
  # and code that has not been reviewed or merged never runs next to the
  # real keys.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/build.yml
    # What build.yml's jobs ask for. On a pull request nothing is pushed or
    # uploaded; fork PRs get a read-only token whatever is granted here.
    permissions:
      contents: read
      packages: write
      security-events: write

  # The publishing half of build.yml and release.yml, which a pull request
  # never reaches (nothing is pushed or signed there): the same registry
  # login, cosign-installer and cosign release, the same push flags
  # (.github/actions/publish), sign and verify flags (.github/actions/sign),
  # and release.yml's digest-preserving promotion, rehearsed on a stand-in
  # image against a throwaway registry on the runner. So a Renovate bump of
  # any of these tools is tested before it merges, not by the next push to
  # main or the Monday release. Cheap, so on every PR.
  #
  # When changing a pin or a flag here, change it in .github/actions/publish
  # or .github/actions/sign (and the login in build.yml and release.yml)
  # too; Renovate updates all of them in the same PR.
  signing:
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      # The distribution project's own image on ghcr.io, not Docker Hub's
      # `registry`, which rate-limits anonymous pulls.
      # renovate: datasource=docker depName=ghcr.io/distribution/distribution
      REGISTRY_VERSION: "3.1.2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the runner
        uses: ./.github/actions/prepare-runner
        with:
          need: "10"

      # Read-only on a pull request, but it proves the action still logs in.
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"

      - name: Push, sign, verify and promote on a local registry
        run: |
          set -euo pipefail
          # A registry of our own on localhost (plain HTTP), so nothing is
          # pushed anywhere real and no write token is needed.
          podman run -d --rm --name ci-registry -p 127.0.0.1:5000:5000 \
            "ghcr.io/distribution/distribution:${REGISTRY_VERSION}"
          trap 'podman rm -f ci-registry >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:5000/v2/ >/dev/null 2>&1 && break; sleep 1; done
          repo=localhost:5000/ci/fedora-bootc

          # A stand-in for the OS image: small, but pushed, signed and
          # promoted with the same commands and flags as the real one.
          printf 'FROM scratch\nCOPY keys/cosign.pub /stand-in\n' > "${RUNNER_TEMP}/Containerfile.stand-in"
          podman build -f "${RUNNER_TEMP}/Containerfile.stand-in" -t ci-stand-in .
          podman push --retry 5 --retry-delay 15s --tls-verify=false \
            --digestfile="${RUNNER_TEMP}/digestfile" ci-stand-in "${repo}:build-ci"
          digest=$(cat "${RUNNER_TEMP}/digestfile")

          # A throwaway key: this proves the tooling, not the key, and keeps
          # the real SIGNING_SECRET away from pull request code.
          COSIGN_PASSWORD="" cosign generate-key-pair --output-key-prefix "${RUNNER_TEMP}/ci"
          COSIGN_PRIVATE_KEY=$(cat "${RUNNER_TEMP}/ci.key")
          export COSIGN_PRIVATE_KEY COSIGN_PASSWORD=""
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "${repo}@${digest}"
          cosign verify --key "${RUNNER_TEMP}/ci.pub" --insecure-ignore-tlog=true "${repo}@${digest}" >/dev/null

          # Promotion as in release.yml: a registry-side copy that must keep
          # the digest, so that the signature still covers the promoted tag.
          skopeo copy --all --preserve-digests --retry-times 3 \
            --src-tls-verify=false --dest-tls-verify=false \
            "docker://${repo}:build-ci" "docker://${repo}:latest"
          promoted=$(skopeo inspect --tls-verify=false --format '{{.Digest}}' "docker://${repo}:latest")
          [ "$promoted" = "$digest" ] || { echo "promotion changed the digest: ${digest} -> ${promoted}" >&2; exit 1; }
          cosign verify --key "${RUNNER_TEMP}/ci.pub" --insecure-ignore-tlog=true "${repo}:latest" >/dev/null
          echo "pushed, signed, verified and promoted ${repo}@${digest}"

  # The live image and the install ISO, as release.yml builds them (`just
  # iso`), whenever something they are made of changes. Nothing is pushed or
  # published. The first place the rootless Flatpak install of the live image
  # runs before a release.
  iso:
    needs: changes
    if: needs.changes.outputs.iso == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the runner
        uses: ./.github/actions/prepare-runner
        with:
          need: "35"
          pull-from: installer/live.Containerfile
          pull: quay.io/fedora/fedora:latest

      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tools: just

      - name: Build the ISO
        run: |
          set -euo pipefail
          just iso
          iso=$(find output -maxdepth 1 -name '*.iso' | head -1)
          test -n "$iso" || { echo "just iso produced no ISO in output/" >&2; exit 1; }
          size=$(stat -c %s "$iso")
          echo "${iso}: $((size / 1024 / 1024)) MiB"
          if [ "$size" -ge $((2 * 1024 * 1024 * 1024)) ]; then
            echo "::notice::over GitHub's 2 GiB asset limit; release.yml will split it"
          fi

      # What release.yml checks before pushing the live image.
      - name: Scan the live image
        uses: ./.github/actions/scan-image
        with:
          image: localhost/fedora-bootc:live
          name: live
          upstream-paths: var/lib/flatpak/

      - name: Disk usage on failure
        if: failure()
        run: |
          df -h / || true
          podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}' || true

  ci-ok:
    needs: [changes, lint, pins, image, signing, iso]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Everything that ran passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
