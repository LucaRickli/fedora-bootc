# Put the tools pinned in tools.txt, next to this file, on the runner's PATH:
# the pinned release, checked against upstream's sha256 (install.sh), so a
# job runs a known binary and nothing a job downloads goes unchecked. For
# `just`, which every job runs its recipes with: a setup-* action would
# fetch it with no checksum at all and hand it the job's token on top.
name: Install tools
description: install.sh the named tools (the tools.txt pins next to this action) and add them to PATH
inputs:
  tools:
    description: names from tools.txt next to this action, whitespace-separated
    required: true
runs:
  using: composite
  steps:
    - name: Install
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      # The GITHUB_PATH write is the one way onto the PATH of the steps that
      # follow, and what lands there was just checked against upstream's
      # sha256: hence the zizmor ignore.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        prefix="${RUNNER_TEMP}/tools"
        # shellcheck disable=SC2086  # one name per word
        "${GITHUB_ACTION_PATH}/install.sh" "$prefix" $TOOLS
        echo "${prefix}/bin" >> "$GITHUB_PATH"
