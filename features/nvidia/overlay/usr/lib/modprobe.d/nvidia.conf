# =============================================================================
# NVIDIA kernel module options
# =============================================================================
#
# nvidia_drm.modeset=1
#   Enables DRM kernel mode-setting. REQUIRED for Wayland compositors to use
#   the NVIDIA GPU directly (via GBM/EGL).
#
# nvidia_drm.fbdev=1
#   Exposes a /dev/fb device backed by the NVIDIA DRM driver (kernel >= 6.2),
#   so the text console keeps working on the NVIDIA output.
#
# nvidia.NVreg_PreserveVideoMemoryAllocations=1
#   Keeps GPU memory allocations across suspend/resume cycles. The open
#   modules default to keeping them only with the kernel's suspend notifiers
#   on, which the next option turns off, so this is what keeps them. Needs the
#   nvidia-suspend/nvidia-resume/nvidia-hibernate services, enabled by
#   xorg-x11-drv-nvidia-power, and a file system other than tmpfs for
#   NVreg_TemporaryFilePath.
#
# nvidia.NVreg_UseKernelSuspendNotifiers=0
#   Has those services save the video memory, as before driver 615. Its
#   default (1) saves it from systemd-sleep instead, which SELinux
#   (systemd_sleep_t) keeps from writing to NVreg_TemporaryFilePath, so every
#   suspend failed: "NVRM: The temporary file path ... could not be opened
#   (error -13)". The services run only while the driver reports
#   "UseKernelSuspendNotifiers: 0" (their ExecCondition).
# =============================================================================

options nvidia_drm modeset=1 fbdev=1
options nvidia    NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp NVreg_UseKernelSuspendNotifiers=0
