# The boot feature's part of the initramfs. Every dracut run on the image
# reads it: image/initramfs.sh's, which fails the seal if something declared
# here is missing, and kdump's (mkdumprd) too.

# The boot splash (usr/lib/bootc/kargs.d/30-quiet-boot.toml): without plymouth
# a quiet boot is a black screen, and the LUKS passphrase prompt plain console
# text. It brings drm, the GPU drivers and their firmware with it. Declared,
# so that dracut fails instead of leaving it out.
add_dracutmodules+=" plymouth "
# Its theme, bgrt (setup.sh checks it is the default), which plymouth's own
# dracut module installs: only checked (image/initramfs.sh), never installed.
fedora_bootc_check_items+=" /usr/share/plymouth/themes/bgrt/bgrt.plymouth "
