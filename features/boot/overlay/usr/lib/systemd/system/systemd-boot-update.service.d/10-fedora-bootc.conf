# systemd's own updater for systemd-boot on the ESP, which bootc never
# updates after it installs: `bootctl update` replaces the copy there only
# with a newer one from the image (features/boot/sign.sh signs each build's),
# so booting the rollback changes nothing. --graceful makes that, the same
# version or another boot loader in EFI/BOOT/, no error; a failed copy still
# fails the unit. The image is the one this boot started, and the db key that
# signed its UKI, which the firmware just accepted, signed its systemd-boot
# too: Secure Boot trusts the new copy.
#
# bootctl finds the ESP only where it is mounted, and it is not mounted here
# (usr/libexec/fedora-bootc/with-esp mounts it for this unit). Only when
# booted by systemd-boot, which tells the ESP's partition
# (LoaderDevicePartUUID), and after udev's coldplug, which makes its
# /dev/disk/by-partuuid link.
[Unit]
ConditionPathExists=/sys/firmware/efi/efivars/LoaderDevicePartUUID-4a67b082-0a4c-41cf-b6c7-440b29bb8c4f
After=systemd-udev-trigger.service

[Service]
ExecStart=
ExecStart=/usr/libexec/fedora-bootc/with-esp /usr/bin/bootctl --variables=no --graceful --esp-path={} update
PrivateMounts=yes
