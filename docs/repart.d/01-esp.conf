# ESP: holds systemd-boot and the sealed UKIs, and is mounted at /boot only
# during the install. Used by `systemd-repart --definitions=docs/repart.d`
# during a manual install (docs/install.md). The GPT type is what the firmware
# and gpt-auto match.
[Partition]
Type=esp
Format=vfat
SizeMinBytes=2G
SizeMaxBytes=2G
